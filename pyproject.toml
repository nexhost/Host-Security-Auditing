[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexhost-hsa"
version = "0.1.0"
description = "Authorized host security auditing and asset inventory platform"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "SQLAlchemy>=2.0,<3",
  "PySide6>=6.7,<7",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-setuptools"]
reports = ["Jinja2>=3.1", "WeasyPrint>=62"]
integrations = ["httpx>=0.27"]

[project.scripts]
nexhost-hsa = "app.cli.commands:main"
nexhost-hsa-gui = "app.main:main"

[project.urls]
Homepage = "https://github.com/nexhost/Host-Security-Auditing"
Repository = "https://github.com/nexhost/Host-Security-Auditing"
Issues = "https://github.com/nexhost/Host-Security-Auditing/issues"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "S"]
ignore = ["E701", "E702", "S101", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
